apiVersion: agentteams.agentscope.ai/v1alpha1
kind: Team
metadata:
  name: agent-infra-collaboration
  labels:
    project: agent-infra
    environment: isolated
spec:
  manager:
    name: Danny
    runtime: openclaw
    role: manager
  team_leader:
    name: Morgan
    runtime: openclaw
    role: team_leader
  workers:
    - name: Rex
      runtime: hermes
      role: executor
      skills:
        - safe-remediation
        - rollback-action
    - name: Dr. Sage
      runtime: hermes
      role: verifier
      skills:
        - evidence-bundle
    - name: Juno
      runtime: hermes
      role: consolidator
      skills:
        - evidence-bundle
  room:
    human_intervention: true
    visible_handoffs: true
    intervention_commands:
      - approve
      - reject
      - pause
      - resume
      - retry
      - reassign
      - cancel
    shared_filesystem: false
  policy:
    self_attestation: false
    dry_run: true
    production_writes: false
    mission_control_base_url: http://127.0.0.1:3015
    mission_control_mode: isolated
